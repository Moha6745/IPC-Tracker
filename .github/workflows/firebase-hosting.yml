# ينشر الصفحة على Firebase Hosting مع كل دفعة إلى main.
# يحتاج سرّاً واحداً في المستودع باسم FIREBASE_SERVICE_ACCOUNT — التفاصيل في README.
name: نشر على Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # غياب السرّ يعني أن الاستضافة لم تُعدّ بعد — تنبيه وتخطٍّ، لا فشل.
      - name: تحقق من سرّ حساب الخدمة
        id: check
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::warning::السرّ FIREBASE_SERVICE_ACCOUNT غير مضبوط — تُخطّي النشر على Firebase Hosting. أضفه من Settings ← Secrets and variables ← Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.ready == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ipc-tracker-daa8e
          channelId: live
